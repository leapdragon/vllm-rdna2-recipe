[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-rdna2"
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = [{name = "Aron Hsiao"}]
description = "Push-based TP=2 all-reduce for RDNA2 (gfx1030), as a vLLM general plugin"

[project.entry-points."vllm.general_plugins"]
ar_rdna2 = "ar_rdna2:register"

[tool.setuptools]
packages = ["ar_rdna2"]

[tool.setuptools.package-data]
ar_rdna2 = ["csrc/*"]
